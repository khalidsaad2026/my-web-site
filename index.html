<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحالف المصدر الرائد | Leading Source Alliance</title>
  <meta name="description" content="تحالف المصدر الرائد - قوة استثمارية تقود المشاريع العملاقة في المملكة العربية السعودية." />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'system-ui', 'sans-serif'] },
          colors: { brand: { black: '#000000', charcoal: '#111111', gold: '#D4AF37', goldSoft: '#F5E6B8', white: '#FFFFFF' } }
        }
      }
    }
  </script>
  <style>
    body { background: radial-gradient(circle at top, #1f1f1f 0, #000000 55%, #000000 100%); }
    .gold-border { border-image: linear-gradient(90deg, #D4AF37, #F5E6B8, #D4AF37) 1; }
  </style>
</head>
<body class="font-sans text-brand-white antialiased">

  <header class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-brand-gold/30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#" class="flex items-center">
        <img src="logo.png" alt="LSA Logo" class="h-14 w-auto">
      </a>
      
      <nav class="flex items-center gap-8 text-xs font-bold tracking-widest uppercase">
        <a href="#about" class="hover:text-brand-gold transition" id="nav-about">عن التحالف</a>
        <a href="#services" class="hover:text-brand-gold transition" id="nav-services">الخدمات</a>
        <a href="#sectors" class="hover:text-brand-gold transition" id="nav-sectors">القطاعات</a>
        <a href="#contact" class="hover:text-brand-gold transition" id="nav-contact">تواصل</a>
        <button id="lang-btn" onclick="toggleLanguage()" class="border border-brand-gold px-4 py-1.5 rounded-full hover:bg-brand-gold hover:text-black transition">
            English
        </button>
      </nav>
    </div>
  </header>

  <main class="relative z-10">
    <section class="pt-20 pb-24 px-4 text-center">
       <h1 class="text-4xl md:text-5xl font-black leading-tight text-brand-white mb-6" id="hero-title">تحالف المصدر الرائد</h1>
       <p class="text-gray-300 max-w-2xl mx-auto mb-10" id="hero-desc">منصة القوة للمشاريع الكبرى في المملكة العربية السعودية.</p>
       <a href="#contact" id="hero-btn" class="px-8 py-3 rounded-full bg-brand-gold text-black font-bold uppercase text-xs tracking-widest hover:bg-white transition">ابدأ شراكتك الآن</a>
    </section>

    </main>

  <footer class="border-t border-brand-gold/20 bg-black/90 py-4 px-4 mt-10">
    <div class="max-w-6xl mx-auto text-center text-[11px] text-gray-500" id="footer-copy">
        © تحالف المصدر الرائد – Leading Source Alliance. جميع الحقوق محفوظة.
    </div>
  </footer>

  <script>
    // حافظ على دالة toggleLanguage والمنطق الخاص بك كما هو
  </script>
</body>
</html>
